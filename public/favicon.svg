<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- 深蓝科技底 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123a6b"/>
      <stop offset="1" stop-color="#081a38"/>
    </linearGradient>
    <!-- 数据柱荧光渐变 -->
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#28a2ce"/>
      <stop offset="1" stop-color="#23f9ff"/>
    </linearGradient>
    <linearGradient id="barGold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c78a1e"/>
      <stop offset="1" stop-color="#fcc62a"/>
    </linearGradient>
    <!-- 扫描线渐隐 -->
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#23f9ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#23f9ff"/>
      <stop offset="1" stop-color="#23f9ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角方块 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none"
        stroke="#23f9ff" stroke-opacity=".55" stroke-width="2"/>

  <!-- 顶部企业"屋檐"轮廓：象征企业监管 -->
  <path d="M14 20 L32 11 L50 20" fill="none"
        stroke="#75f0cd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 数据柱：循环升腾 -->
  <g>
    <rect x="17" y="34" width="6" height="18" rx="2" fill="url(#bar)">
      <animate attributeName="height" values="8;18;8" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="44;34;44" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="27" y="28" width="6" height="24" rx="2" fill="url(#barGold)">
      <animate attributeName="height" values="14;26;14" dur="1.6s" begin="-0.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="38;26;38" dur="1.6s" begin="-0.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="37" y="30" width="6" height="22" rx="2" fill="url(#bar)">
      <animate attributeName="height" values="22;10;22" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="30;42;30" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="47" y="26" width="5" height="26" rx="2" fill="url(#barGold)" opacity=".9">
      <animate attributeName="height" values="12;28;12" dur="1.6s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="40;24;40" dur="1.6s" begin="-1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 底部扫描线：上下巡检 -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -46; 0 0" keyTimes="0;.5;1"
                      dur="2.4s" repeatCount="indefinite"/>
    <rect x="12" y="55" width="40" height="2" rx="1" fill="url(#scan)"/>
  </g>

  <!-- 顶部高亮数据点：呼吸闪烁 -->
  <circle cx="32" cy="11" r="2.6" fill="#ffea38">
    <animate attributeName="r" values="2.2;3.4;2.2" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.5;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>
