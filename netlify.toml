# Netlify 部署配置（React SPA，2000px 大屏）
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# 旧静态页 301 到新路由（/index.html 由 Netlify pretty-URL 之外再兜一层）
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/PartyBuildingManagement.html"
  to = "/party-building"
  status = 301

[[redirects]]
  from = "/InvestmentManager.html"
  to = "/investment"
  status = 301

[[redirects]]
  from = "/overviewOfAssets.html"
  to = "/overview-of-assets"
  status = 301

[[redirects]]
  from = "/riskWarning.html"
  to = "/risk-warning"
  status = 301

[[redirects]]
  from = "/tripleAndOneBig.html"
  to = "/triple-one"
  status = 301

# 默认（含入口 HTML）：每次回源校验，确保拿到最新的 hash 资源名。
# 放在具体的缓存规则之前，让下方的 /assets /seq /media 覆盖它。
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Vite 产物：文件名带内容 hash，变更即换名，可永久缓存
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 帧序列与视频：文件名内容不变，永久缓存
# （重新生成序列时换新目录名，如 /seq/economy-v2/，避免缓存滞留）
[[headers]]
  for = "/seq/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback 必须放在最后
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
